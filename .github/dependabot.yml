version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Australia/Sydney"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "06:00"
      timezone: "Australia/Sydney"
    cooldown:
      default-days: 7
    groups:
      prod-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
