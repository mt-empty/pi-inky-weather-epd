name: Release Build

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel builds in progress

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        target:
          - arm-unknown-linux-gnueabihf   # Raspberry Pi Zero
          - armv7-unknown-linux-gnueabihf # Raspberry Pi Zero 2
          - aarch64-unknown-linux-gnu     # Raspberry Pi 4 and above
          - x86_64-unknown-linux-gnu      # x86
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # No cargo cache here: these binaries ship, and a cache written by a master run
      # (target/, ~/.cargo/bin/cross) must not flow into a release.
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install

      # Prebuilt static binary, checksum-pinned (the hash matches taiki-e/install-action's manifest).
      - name: Install cross
        env:
          CROSS_URL: https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz
          CROSS_SHA256: a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cross.tar.gz" "$CROSS_URL"
          echo "$CROSS_SHA256  $RUNNER_TEMP/cross.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cross"
          tar xzf "$RUNNER_TEMP/cross.tar.gz" -C "$RUNNER_TEMP/cross"
          echo "$RUNNER_TEMP/cross" >> "$GITHUB_PATH"

      - name: Build binary with cross
        env:
          TARGET: ${{ matrix.target }}
        run: cross build --release --target="$TARGET"

      - name: Prepare artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifact/config/
          cp "$GITHUB_WORKSPACE/target/$TARGET/release/pi-inky-weather-epd" artifact/
          cp "$GITHUB_WORKSPACE/dashboard-template-min.svg" artifact/
          cp "$GITHUB_WORKSPACE/config/default.toml" artifact/config/
          cp -r "$GITHUB_WORKSPACE/static" artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: artifact
          retention-days: 7
          overwrite: true

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./artifacts

      - name: Zip artifacts
        run: |
          cd artifacts/arm-unknown-linux-gnueabihf && zip -r ../arm-unknown-linux-gnueabihf.zip . && cd -
          cd artifacts/armv7-unknown-linux-gnueabihf && zip -r ../armv7-unknown-linux-gnueabihf.zip . && cd -
          cd artifacts/aarch64-unknown-linux-gnu && zip -r ../aarch64-unknown-linux-gnu.zip . && cd -
          cd artifacts/x86_64-unknown-linux-gnu && zip -r ../x86_64-unknown-linux-gnu.zip . && cd -

      # Devices update from /releases/latest and download <target>.zip, so every release,
      # betas included, is marked Latest and the asset names must not change.
      # A re-run of an existing release replaces its assets.
      - name: Create and Upload Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            artifacts/arm-unknown-linux-gnueabihf.zip
            artifacts/armv7-unknown-linux-gnueabihf.zip
            artifacts/aarch64-unknown-linux-gnu.zip
            artifacts/x86_64-unknown-linux-gnu.zip
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag \
              --latest \
              "${assets[@]}"
          fi
