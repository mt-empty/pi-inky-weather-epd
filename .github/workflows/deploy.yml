name: Deploy Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  check-branch:
    name: Verify tag is on master
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Need full history to check branches
          persist-credentials: false

      - name: Check if tag is on master branch
        run: |
          # Get the commit SHA for this tag
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          # Check if this commit is on master (exact ancestry, not a branch-name substring)
          if git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
            echo "✅ Tag $GITHUB_REF_NAME is on master branch"
          else
            echo "❌ Tag $GITHUB_REF_NAME is NOT on master branch"
            exit 1
          fi

  test:
    name: Run Tests
    needs: check-branch
    uses: ./.github/workflows/test.yml

  release:
    name: Build and Release
    needs: test
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
